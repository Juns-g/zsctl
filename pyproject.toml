[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zsctl"
version = "0.1.0"
description = "Control plane CLI for ZSpace (极空间) NAS — Docker, storage pools, disk sleep diagnostics, and downloads."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Juns" }
]
dependencies = [
    "zspace-cli>=0.1.3",
    "httpx>=0.27.0",
]

[project.scripts]
zsctl = "zsctl.cli:main"

[project.urls]
Homepage = "https://github.com/juns/zsctl"
